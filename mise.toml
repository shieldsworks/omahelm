# `mise install` gets the toolchain; `mise tasks` lists the jobs and each
# runs as `mise <job>`.

[tools]
rust = { version = "1.98", profile = "minimal", components = "rustfmt,clippy" }

[tasks.build]
description = "Release build (the chart engine is slow unoptimized)"
run = "cargo build --release --locked"

[tasks.test]
description = "Unit tests, the chart fixtures and the golden tiles"
run = "cargo test --locked"

[tasks.goldens]
description = "Only the golden tiles, byte for byte against tests/golden/"
run = "cargo test --locked --test goldens"

[tasks.bless]
description = "Redraw tests/golden/*.png on purpose; the PR says what changed visibly"
run = "BLESS=1 cargo test --locked --test goldens"

[tasks.lint]
description = "rustfmt check and clippy with warnings denied"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
]

[tasks.format]
description = "rustfmt, writing"
run = "cargo fmt"

[tasks.start]
description = "Build, then open the chartplotter from this checkout"
run = "cargo build --release --locked && ./run.sh"
